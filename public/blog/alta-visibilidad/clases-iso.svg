<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">ISO 20471: clases 1, 2 y 3</title><desc id="desc">Bloques comparativos de material de fondo y retrorreflectivo. No se atribuye clase a un flat.</desc><rect x="0" y="0" width="1200" height="600" rx="0" fill="#FFFFFF" stroke="none"/><text x="40" y="60" fill="#01018B" font-family="Arial, sans-serif" font-size="38" font-weight="normal" text-anchor="start">ISO 20471: clases y superficies relativas</text><text x="40" y="103" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Comparación de mínimos para materiales separados; no representa prendas.</text><rect x="40" y="140" width="28" height="20" rx="0" fill="#E8FF00" stroke="#393535"/><text x="80" y="157" fill="#393535" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Fluorescente amarillo</text><rect x="340" y="140" width="28" height="20" rx="0" fill="#FF8600" stroke="#393535"/><text x="380" y="157" fill="#393535" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Fluorescente naranja</text><rect x="670" y="140" width="28" height="20" rx="0" fill="#A4ADB5" stroke="#393535"/><text x="710" y="157" fill="#393535" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Retrorreflectivo</text><text x="40" y="230" fill="#01018B" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start">Clase 1</text><text x="40" y="275" fill="#393535" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Fondo fluorescente</text><rect x="40" y="294" width="53" height="66" rx="0" fill="#E8FF00" stroke="#393535"/><text x="40" y="405" fill="#393535" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Retrorreflectivo</text><rect x="40" y="425" width="150" height="26" rx="0" fill="#A4ADB5" stroke="#393535"/><text x="420" y="230" fill="#01018B" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start">Clase 2</text><text x="420" y="275" fill="#393535" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Fondo fluorescente</text><rect x="420" y="294" width="188" height="66" rx="0" fill="#E8FF00" stroke="#393535"/><text x="420" y="405" fill="#393535" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Retrorreflectivo</text><rect x="420" y="425" width="195" height="26" rx="0" fill="#A4ADB5" stroke="#393535"/><text x="800" y="230" fill="#01018B" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start">Clase 3</text><text x="800" y="275" fill="#393535" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Fondo fluorescente</text><rect x="800" y="294" width="300" height="66" rx="0" fill="#E8FF00" stroke="#393535"/><text x="800" y="405" fill="#393535" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Retrorreflectivo</text><rect x="800" y="425" width="300" height="26" rx="0" fill="#A4ADB5" stroke="#393535"/><text x="40" y="520" fill="#393535" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Comparar los valores en el cuadro de superficies mínimas del artículo.</text><text x="40" y="560" fill="#01018B" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">La superficie por sí sola no acredita clase, diseño ni desempeño.</text></svg>