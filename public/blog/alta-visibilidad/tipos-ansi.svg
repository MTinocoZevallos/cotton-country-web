<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Tipos O, R y P de ANSI/ISEA 107-2020</title><desc id="desc">Tres contextos de uso representados sin prendas clasificadas ni marcas comerciales.</desc><rect x="0" y="0" width="1200" height="600" rx="0" fill="#FFFFFF" stroke="none"/><text x="40" y="60" fill="#01018B" font-family="Arial, sans-serif" font-size="38" font-weight="normal" text-anchor="start">ANSI/ISEA 107-2020: tipos de uso</text><text x="40" y="103" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">El tipo identifica el contexto de utilización, no una categoría de prenda.</text><rect x="40" y="145" width="340" height="365" rx="16" fill="#FFFFFF" stroke="#C9C8C3"/><text x="68" y="195" fill="#01018B" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start">Tipo O</text><path d="M130 290V245L210 213L290 245V290M130 245H290M180 290V258H240V290" fill="none" stroke="#01018B" stroke-width="5"/><text x="68" y="355" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Fuera de vías públicas</text><text x="68" y="392" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Riesgos de vehículos</text><text x="68" y="429" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">o equipos móviles</text><rect x="430" y="145" width="340" height="365" rx="16" fill="#FFFFFF" stroke="#C9C8C3"/><text x="458" y="195" fill="#01018B" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start">Tipo R</text><path d="M545 215L515 295M655 215L685 295M600 220V238M600 252V270M600 284V295" fill="none" stroke="#01018B" stroke-width="5"/><text x="458" y="355" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Tránsito vial</text><text x="458" y="392" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Vehículos y equipos</text><text x="458" y="429" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">móviles</text><rect x="820" y="145" width="340" height="365" rx="16" fill="#FFFFFF" stroke="#C9C8C3"/><text x="848" y="195" fill="#01018B" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start">Tipo P</text><rect x="955" y="235" width="70" height="70" rx="8" fill="#FF8600" stroke="#01018B"/><path d="M970 235L960 215M1010 255H971M970 275H995" stroke="#01018B" stroke-width="5"/><text x="848" y="355" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Seguridad pública</text><text x="848" y="392" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Respuesta a</text><text x="848" y="429" fill="#393535" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start">emergencias</text><text x="40" y="560" fill="#01018B" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Evaluar la operación y la clase aplicable; no hay equivalencia automática con ISO.</text></svg>